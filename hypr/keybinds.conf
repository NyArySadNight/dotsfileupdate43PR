$mod = SUPER

# ---------------------------------------------------------------------------
# GIỮ NGUYÊN TOÀN BỘ KEYBIND GỐC TỪ 43PR/dotfiles
# ---------------------------------------------------------------------------
bind = $mod, T, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, E, exec, $fileManager
bind = $mod, B, exec, $browser
bind = $mod, F, fullscreen
bind = $mod, Q, killactive
bind = $mod, Tab, exec, hyprlock
bind = $mod, Escape, exec, wlogout -b 5 -m 470 -c 15

bind = $mod SHIFT, W, exec, sh -c 'pgrep -x waybar >/dev/null && pkill waybar || nohup waybar >/dev/null 2>&1 &'

bind = $mod, Space, exec, hyprctl dispatch togglefloating && hyprctl dispatch resizeactive exact 50% 50% && hyprctl dispatch centerwindow

bind = SUPER, right, exec, ~/.config/hypr/scripts/wallpaper-cycle.sh next
bind = SUPER, left, exec, ~/.config/hypr/scripts/wallpaper-cycle.sh prev

bind = $mod, Delete, exec, grim ~/Pictures/$(date +%s).png
bind = , Delete, exec, grim -g "$(slurp)" ~/Pictures/$(date +%s).png

bind = $mod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

# ---------------------------------------------------------------------------
# BỔ SUNG MỚI — điều hướng workspace/window, resize mode, OSD âm lượng/độ sáng
# ---------------------------------------------------------------------------
bind = $mod, left,  movefocus, l
bind = $mod, down,  movefocus, d
bind = $mod, up,    movefocus, u
bind = $mod SHIFT, right, movefocus, r

bind = $mod CTRL, left,  movewindow, l
bind = $mod CTRL, down,  movewindow, d
bind = $mod CTRL, up,    movewindow, u
bind = $mod CTRL, right, movewindow, r

bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspacesilent, special:magic

binde = $mod, R, submap, resize
submap = resize
binde = , right, resizeactive, 20 0
binde = , left,  resizeactive, -20 0
binde = , up,    resizeactive, 0 -20
binde = , down,  resizeactive, 0 20
bind = , escape, submap, reset
submap = reset

# workspace 1-10
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# OSD âm lượng / độ sáng mượt (dùng swayosd)
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl  = , XF86AudioMute,        exec, swayosd-client --output-volume mute-toggle
bindel = , XF86MonBrightnessUp,   exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# region screenshot vào clipboard (khác với bind gốc lưu ra file)
bind = $mod SHIFT, Delete, exec, grim -g "$(slurp)" - | wl-copy
