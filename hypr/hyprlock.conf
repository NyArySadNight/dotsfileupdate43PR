$accent = rgba(89b4faee)

background {
    monitor =
    path = ~/.config/hypr/wallpapers/lockscreen.png
    blur_passes = 4
    blur_size = 8
    noise = 0.02
    contrast = 1.0
    brightness = 0.75
    vibrancy = 0.2
}

general {
    hide_cursor = false
    grace = 2
    disable_loading_bar = false
}

# đồng hồ lớn — hoạt ảnh fade-in khi mở khóa
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 160
    halign = center
    valign = center
    color = rgba(cdd6f4ff)
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A, %d %B')"
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
    color = rgba(a6adc8ff)
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = $accent
    inner_color = rgba(1e1e2eaa)
    font_color = rgba(cdd6f4ff)
    fade_on_empty = true
    placeholder_text = <i>Nhập mật khẩu...</i>
    position = 0, -140
    halign = center
    valign = center
    rounding = 18
    shadow_passes = 2
}
