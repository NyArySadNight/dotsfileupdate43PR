# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
#  StealNateOS Rice — hyprland.conf
#  Nâng cấp dựa trên 43PR/dotfiles: giữ toàn bộ keybind + luồng thao tác gốc,
#  bổ sung animation đa lớp, blur kính mờ, window rules thông minh, OSD.
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/env.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/windowrules.conf

# ---------------------------------------------------------------------------
# INPUT
# ---------------------------------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_cancel_ratio = 0.5
    workspace_swipe_forever = true
}

# ---------------------------------------------------------------------------
# GENERAL
# ---------------------------------------------------------------------------
general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(45475aaa)
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

# ---------------------------------------------------------------------------
# DECORATION — kính mờ + bóng đổ mềm (điểm khác biệt lớn nhất so với bản gốc)
# ---------------------------------------------------------------------------
decoration {
    rounding = 14

    active_opacity = 1.0
    inactive_opacity = 0.92
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 7
        passes = 4
        new_optimizations = true
        xray = true
        ignore_opacity = true
        contrast = 1.05
        brightness = 1.0
        vibrancy = 0.18
        popups = true
    }

    shadow {
        enabled = true
        range = 22
        render_power = 3
        color = rgba(00000066)
        offset = 0, 6
    }
}

# ---------------------------------------------------------------------------
# ANIMATIONS — nhiều bezier tùy chỉnh, mở/đóng/di chuyển đều có easing riêng
# đây là phần "hoạt cảnh mượt" được yêu cầu giữ lại và nâng cấp
# ---------------------------------------------------------------------------
animations {
    enabled = true

    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = easeOutBack, 0.34, 1.56, 0.64, 1
    bezier = smoothIn,    0.05, 0.9, 0.1, 1
    bezier = smoothOut,   0.5, 0, 0.1, 1
    bezier = linear,      0, 0, 1, 1
    bezier = overshot,    0.05, 0.9, 0.1, 1.1

    animation = windows,     1, 4, easeOutExpo, popin 82%
    animation = windowsIn,   1, 4, easeOutBack, popin 82%
    animation = windowsOut,  1, 3, smoothOut, popin 80%
    animation = windowsMove, 1, 3.5, easeOutExpo, slide

    animation = fade,     1, 4, smoothIn
    animation = fadeIn,   1, 3, smoothIn
    animation = fadeOut,  1, 3, smoothOut
    animation = fadeDim,  1, 3, smoothIn

    animation = border,      1, 6, linear
    animation = borderangle, 1, 30, linear, loop

    animation = workspaces, 1, 4, overshot, slidevert
    animation = specialWorkspace, 1, 3.4, easeOutExpo, slidevert

    animation = layers,   1, 3, easeOutExpo, slide
    animation = layersIn, 1, 3, easeOutBack, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
    vrr = 1
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    enable_swallow = true
    swallow_regex = ^(kitty)$
}
